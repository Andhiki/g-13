name: Pengajuan skripsi
description: Kirim data skripsi untuk ditampilkan di direktori publik Ilmu Komputer UGM.
title: "[Skripsi] "
labels: ["thesis-submission", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah ingin menampilkan skripsimu. Maintainer akan meninjau data ini sebelum menerbitkannya di `/theses`.

        **Issue ini publik.** Jangan sertakan NIM, nilai, transkrip, nomor HP, atau email pribadi yang tidak ingin kamu tampilkan. Kontak yang kamu isi di bawah akan tampil publik jika datanya diterbitkan.

        Jika kamu tidak punya GitHub atau perlu mengirim data privat, hubungi maintainer melalui profil GitHub yang tercantum di [SECURITY.md](https://github.com/Andhiki/g-13/blob/main/SECURITY.md); jangan menulis data privat di issue ini.
  - type: input
    id: thesis_title
    attributes:
      label: Judul skripsi
      description: Tulis judul asli skripsi.
      placeholder: "Contoh: Evaluasi Model Machine Learning untuk Prediksi Kondisi Mesin"
    validations:
      required: true
  - type: input
    id: author_name
    attributes:
      label: Nama penulis
      description: Nama yang ingin ditampilkan di halaman publik.
      placeholder: "Nama lengkap"
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Tahun
      description: Tahun sidang atau kelulusan, empat digit.
      placeholder: "2026"
    validations:
      required: true
  - type: textarea
    id: supervisors
    attributes:
      label: Dosen pembimbing
      description: Satu nama per baris, sesuai urutan yang ingin ditampilkan.
      placeholder: |
        Dr. Nur Rokhman, S.Si., M.Kom.
        Dr. Pembimbing Eksternal
    validations:
      required: true
  - type: textarea
    id: abstract_id
    attributes:
      label: Abstrak (Indonesia, opsional)
      description: Kosongkan jika tidak ingin abstrak ditampilkan. Jika diisi, abstrak akan tampil publik setelah disetujui.
      placeholder: "Tempel abstrak sebagai teks biasa."
  - type: textarea
    id: abstract_en
    attributes:
      label: Abstrak (Inggris, opsional)
      description: Kosongkan jika tidak ada atau tidak ingin ditampilkan.
      placeholder: "Paste the English abstract as plain text."
  - type: input
    id: keywords
    attributes:
      label: Kata kunci (opsional)
      description: Pisahkan dengan koma.
      placeholder: "machine learning, evaluasi, prediksi"
  - type: input
    id: public_contact
    attributes:
      label: Kontak publik (opsional)
      description: Email atau URL yang boleh tampil publik. Kosongkan jika tidak ingin kontak ditampilkan.
      placeholder: "nama@example.com atau https://..."
  - type: input
    id: repository_url
    attributes:
      label: Tautan naskah/ETD (opsional)
      description: Tautan ETD UGM, DOI, repositori, atau publikasi yang sudah terverifikasi. Situs ini tidak menyimpan naskah lengkap.
      placeholder: "https://etd.repository.ugm.ac.id/..."
  - type: dropdown
    id: fields
    attributes:
      label: Sub-lab (opsional, bisa lebih dari satu)
      description: Pilih sub-lab yang sesuai dengan penelitianmu. Kamu bisa memilih lebih dari satu.
      multiple: true
      options:
        - "Lab SKJ - Big Data Processing"
        - "Lab SKJ - Big Data Architecture"
        - "Lab SKJ - Smart City Infrastructures"
        - "Lab SKJ - Intelligent Environment"
        - "Lab SKJ - Infrastructure Data Center"
        - "Lab SKJ - Security and Preservation"
        - "Lab SKJ - Cyber Security"
        - "Lab SKJ - Distributed Network & System"
        - "Lab SKJ - High Speed Network & Management"
        - "Lab SKJ - Operating System & Architecture"
        - "Lab SKJ - Cyber Physical System"
        - "Lab SKJ - Cloud Computing"
        - "Lab SKJ (Sistem Komputer dan Jaringan)"
        - "Lab Elins - Robotics"
        - "Lab Elins - Image Processing"
        - "Lab Elins - Industrial Instrumentation"
        - "Lab Elins - Sensor Tranduser"
        - "Lab Elins - Telecommunication"
        - "Lab Elins - Sensor Network, IoT"
        - "Lab Elins - Signal Processing"
        - "Lab Elins - Embedded system"
        - "Lab Elins (Elektronika dan Instrumentasi)"
        - "Lab AK - Pengolahan Citra"
        - "Lab AK - Digital"
        - "Lab AK - Kriptologi"
        - "Lab AK - Verifikasi dan Validasi"
        - "Lab AK - Sains Komputasional"
        - "Lab AK - Metode Formal"
        - "Lab AK - Metode Numerik"
        - "Lab AK - Grafika Komputer"
        - "Lab AK - Algoritma"
        - "Lab AK - Pemrograman Parallel"
        - "Lab AK - GPU & Parallel Computing"
        - "Lab AK - Approximation Algorithm"
        - "Lab AK - Kompresi Data"
        - "Lab AK (Algoritma dan Komputasi)"
        - "Lab SC - Kecerdasan Komputasional"
        - "Lab SC - Pembelajaran Mesin"
        - "Lab SC - Sistem Pendukung Keputusan"
        - "Lab SC - Logika Fuzzy"
        - "Lab SC - Sistem Pakar dan Penalaran Komputer"
        - "Lab SC - Bioinformatika"
        - "Lab SC - NLP"
        - "Lab SC - Computer Vision"
        - "Lab SC - Intelligent Agent"
        - "Lab SC - AI"
        - "Lab SC (Sistem Cerdas)"
        - "Lab RPLD - Software models, architectures, and patterns"
        - "Lab RPLD - Business process management and modeling"
        - "Lab RPLD - Software engineering processes, methods, practices, and tools"
        - "Lab RPLD - Code analysis"
        - "Lab RPLD - Human computer interactions"
        - "Lab RPLD - User interfaces and experiences"
        - "Lab RPLD - Gamification"
        - "Lab RPLD - Virtual/augmented reality and immersive technologies"
        - "Lab RPLD - Data models, databases, and information retrieval"
        - "Lab RPLD - Big data analysis and visualization"
        - "Lab RPLD - Web, mobile, and ubiquitous computing"
        - "Lab RPLD - Enterprise systems"
        - "Lab RPLD (Rekayasa Perangkat Lunak dan Data)"
        - "Lab RPLD - e-Government"
        - "Lab RPLD - IT Project Management"
        - "Lab RPLD - Software quality assurance"
        - "Lab Elins - Pattern Recognition"
        - "Lab SC - Pattern Recognition"
  - type: input
    id: batch
    attributes:
      label: Angkatan (opsional)
      description: Tahun masuk, empat digit, jika ingin ditampilkan.
      placeholder: "2022"
  - type: checkboxes
    id: consent
    attributes:
      label: Persetujuan
      options:
        - label: Saya adalah penulis skripsi ini dan menyetujui judul, nama, tahun, dosen pembimbing, serta abstrak dan kontak yang saya isi untuk dipublikasikan di situs ini.
          required: true
        - label: Saya memahami issue ini publik dan tidak menyertakan data pribadi yang tidak ingin dipublikasikan.
          required: true
  - type: markdown
    attributes:
      value: |
        Setelah dikirim, maintainer akan meninjau data, memasukkannya lewat dashboard, menerbitkannya, lalu menautkan URL publik di issue ini dan menutup issue. Jika ada kesalahan atau ingin menghapus data, komentar di issue ini atau hubungi maintainer.
