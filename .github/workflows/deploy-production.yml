# Needs the production environment's CLOUDFLARE_API_TOKEN with these account policies:
# - Workers Scripts: Edit (deploy the worker and its bindings)
# - D1: Edit (apply migrations)
# Account Settings: Read is optional because CLOUDFLARE_ACCOUNT_ID is set below.
#
# Resolve the version from the merged release PR before deploying.
# Tag the deployed commit and publish the GitHub Release after success.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  version:
    name: Resolve production version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            | jq -s add | python3 .github/release-version.py resolve)
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -1 "$tag")" = "$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Production release: $tag" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: version
    name: Verify, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 0f1162f3c5692f21189157353ef26e56
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: "26"
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Apply D1 migrations
        env:
          # Production database ID from apps/web/cloudflare.config.ts.
          D1_DATABASE_ID: 4961475b-b620-4a57-8e09-520e8c17578b
        run: bun run db:migrate
      - name: Deploy
        run: bun run deploy

  release:
    name: Tag and release
    needs: [version, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag and publish release
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-list -1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
