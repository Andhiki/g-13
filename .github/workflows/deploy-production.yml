# Needs the production environment's CLOUDFLARE_API_TOKEN with these account policies:
# - Workers Scripts: Edit (deploy the worker and its bindings)
# - D1: Edit (apply migrations)
# Account Settings: Read is optional because CLOUDFLARE_ACCOUNT_ID is set below.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 0f1162f3c5692f21189157353ef26e56
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Apply D1 migrations
        env:
          # Production database ID from apps/web/cloudflare.config.ts.
          D1_DATABASE_ID: 4961475b-b620-4a57-8e09-520e8c17578b
        run: bun run db:migrate
      - name: Deploy
        run: bun run deploy
