name: Staging browser tests

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: "26"
      - name: Install Chromium
        run: bun node_modules/@e2e-dev/web/dist/bin.js install chromium --with-deps
      - name: Build workspace packages
        run: bun run build:packages
      - name: Run functional browser scenarios
        id: functional
        run: bun run test:e2e
      - name: Replay recorded agent scenario
        run: bun run test:e2e:agent
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-sqlite-e2e
          path: |
            .e2e/local/
            .e2e/agent/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: "26"
      - name: Install Chromium
        run: bun node_modules/@e2e-dev/web/dist/bin.js install chromium --with-deps
      - name: Run read-only smoke against shared staging
        run: bun run test:e2e:smoke
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-staging-e2e
          path: .e2e/smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
